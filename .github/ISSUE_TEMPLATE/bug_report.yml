name: Bug report
description: Report a reproducible Regnant defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe observed behaviour and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Pair the device...\n2. Open...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Regnant version or commit
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Linux distribution/session, Android version and relevant tool versions.
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove passwords, tokens, pairing codes, public IPs and personal data.
