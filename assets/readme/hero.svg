<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">Regnant — Linux workstation control from Android</title><desc id="desc">A phone running Regnant connects securely over a local network to a Linux workstation.</desc>
<defs>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#343723" stroke-width="1" opacity=".26"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="14"/><feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2029"/><stop offset="1" stop-color="#11151B"/></linearGradient>
</defs>
<rect width="1440" height="760" rx="28" fill="#0C0F14"/><rect width="1440" height="760" rx="28" fill="url(#grid)"/>
<circle cx="1195" cy="115" r="220" fill="#343723" opacity=".22"/><circle cx="1195" cy="115" r="160" fill="none" stroke="#898861" stroke-width="1.5" opacity=".24"/><circle cx="1195" cy="115" r="112" fill="none" stroke="#898861" stroke-width="1.5" opacity=".18"/>
<path d="M70 650H1370" stroke="#343723" stroke-width="2"/><rect x="70" y="72" width="8" height="58" rx="4" fill="#7D2826"/>
<text x="100" y="97" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#898861">REGNANT / LOCAL WORKSTATION CONTROL</text>
<text x="70" y="204" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="750" fill="#EFE9D7">Your Linux desktop.</text><text x="70" y="276" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="750" fill="#EFE9D7">Within reach.</text>
<text x="74" y="338" font-family="Inter,Arial,sans-serif" font-size="25" fill="#B8B5A3">A native Android control surface for your workstation.</text><text x="74" y="378" font-family="Inter,Arial,sans-serif" font-size="25" fill="#B8B5A3">Workspaces, projects and system actions over your LAN.</text>
<g transform="translate(74 458)">
<rect width="250" height="84" rx="12" fill="#171C23" stroke="#343723" stroke-width="2"/><circle cx="27" cy="29" r="6" fill="#898861"/><text x="48" y="35" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.8" fill="#EFE9D7">LOCAL-FIRST</text><text x="24" y="64" font-family="Inter,Arial,sans-serif" font-size="16" fill="#A9A791">No cloud relay for core control</text>
<rect x="268" width="250" height="84" rx="12" fill="#171C23" stroke="#343723" stroke-width="2"/><circle cx="295" cy="29" r="6" fill="#7D2826"/><text x="316" y="35" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.8" fill="#EFE9D7">AUTHENTICATED</text><text x="292" y="64" font-family="Inter,Arial,sans-serif" font-size="16" fill="#A9A791">Paired device · TLS channel</text>
</g>
